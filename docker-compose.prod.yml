# Override de produção — use junto com docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Secrets e senhas vêm exclusivamente do .env.prod (não versionado).
# PostgreSQL é externo — defina DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD.

services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env.prod}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-${POSTGRES_USER:?Defina DATABASE_USERNAME ou POSTGRES_USER}}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?Defina DATABASE_PASSWORD ou POSTGRES_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET forte (>=32 bytes) no .env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS no .env.prod}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}
      SERVER_CONNECTION_TIMEOUT_MS: ${SERVER_CONNECTION_TIMEOUT_MS:-20000}
      SERVER_TOMCAT_MAX_THREADS: ${SERVER_TOMCAT_MAX_THREADS:-200}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      AUTH_RATE_LIMIT_LOGIN: ${AUTH_RATE_LIMIT_LOGIN:-10}
      AUTH_RATE_LIMIT_REFRESH: ${AUTH_RATE_LIMIT_REFRESH:-20}
      AUTH_RATE_LIMIT_FORGOT: ${AUTH_RATE_LIMIT_FORGOT:-5}
      AUTH_RATE_LIMIT_RESET: ${AUTH_RATE_LIMIT_RESET:-5}
      MANAGEMENT_ENDPOINTS: ${MANAGEMENT_ENDPOINTS:-health,info}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom}
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
