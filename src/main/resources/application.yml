spring.application.name=systemcommerce-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:131072}

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false

app.security.jwt.secret=${JWT_SECRET:change-me-systemcommerce-jwt-secret-key-min-256-bits-long}
app.security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:${JWT_EXPIRATION_MS:900000}}
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.jwt.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:${JWT_EXPIRATION_MS:900000}}

app.security.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.security.auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:30}
app.security.auth.password-reset-expiration-minutes=${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:60}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
app.security.cors.allow-credentials=true

app.security.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login-per-minute=${AUTH_RATE_LIMIT_LOGIN:20}
app.security.rate-limit.refresh-per-minute=${AUTH_RATE_LIMIT_REFRESH:30}
app.security.rate-limit.password-forgot-per-minute=${AUTH_RATE_LIMIT_FORGOT:10}
app.security.rate-limit.password-reset-per-minute=${AUTH_RATE_LIMIT_RESET:10}

app.seed.admin.enabled=${ADMIN_SEED_ENABLED:true}
app.seed.admin.email=${ADMIN_EMAIL:admin@systemcommerce.local}
app.seed.admin.login=${ADMIN_LOGIN:admin}
app.seed.admin.name=${ADMIN_NAME:Administrador}
app.seed.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.admin.role-code=ADMIN
app.seed.admin.user-id=a0000000-0000-4000-8000-000000000001

app.pos.suspended-sales.ttl=${POS_SUSPENDED_SALE_TTL:72h}
app.pos.suspended-sales.same-store-only=${POS_SUSPENDED_SAME_STORE:true}
app.pos.suspended-sales.edit-lock-ttl=${POS_SUSPENDED_EDIT_LOCK_TTL:30m}

app.sale.discount.max-percent=${SALE_DISCOUNT_MAX_PERCENT:100}
app.pos.cash.high-withdrawal-limit=${POS_HIGH_WITHDRAWAL_LIMIT:500.00}
app.pos.sale.operator-discount-max-percent=${POS_OPERATOR_DISCOUNT_MAX_PERCENT:10}

app.multistore.allow-multiple-headquarters=${ALLOW_MULTIPLE_HEADQUARTERS:false}
app.employee.require-active-assignment=${EMPLOYEE_REQUIRE_ACTIVE_ASSIGNMENT:false}
app.seller.lotation-grants-commercial-auth=${SELLER_LOTATION_GRANTS_COMMERCIAL_AUTH:false}

systemcommerce.integration.secrets-key=${INTEGRATION_SECRETS_KEY:}
systemcommerce.integration.job-poll-ms=${INTEGRATION_JOB_POLL_MS:15000}
systemcommerce.webhooks.outbox-poll-ms=${WEBHOOK_OUTBOX_POLL_MS:10000}
systemcommerce.webhooks.delivery-poll-ms=${WEBHOOK_DELIVERY_POLL_MS:10000}

systemcommerce.dashboard.executive.cache-ttl-seconds=${EXECUTIVE_DASHBOARD_CACHE_TTL:300}
systemcommerce.bi.refresh-cron=${BI_REFRESH_CRON:0 0 2 * * *}
systemcommerce.fiscal.sefaz.stub=${FISCAL_SEFAZ_STUB:true}
systemcommerce.fiscal.signing.allow-test-provider=${FISCAL_ALLOW_TEST_SIGNATURE:true}

logging.level.root=INFO
logging.level.br.com.systemcommerce=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId}] [storeId=%X{storeId}] %logger{36} - %msg%n
